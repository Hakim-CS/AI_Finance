language: "en-US"

reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false

path_filters:
  - "!**/dist/**"
  - "!**/node_modules/**"
  - "!ScreenShots/**"
  - "!**/package-lock.json"
